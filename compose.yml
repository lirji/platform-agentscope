services:
  orchestrator:
    image: ${AGENTSCOPE_IMAGE:-agentscope-platform:local}
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8085
      INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER:-langchain4j-platform}
      INTERNAL_JWT_AUDIENCE: ${INTERNAL_JWT_AUDIENCE:-platform-internal}
      INTERNAL_JWT_KEY_ID: ${INTERNAL_JWT_KEY_ID:-platform-internal-v1}
      INTERNAL_JWT_TOKEN_USE: ${INTERNAL_JWT_TOKEN_USE:-internal_access}
      INTERNAL_JWT_CLOCK_SKEW_SECONDS: ${INTERNAL_JWT_CLOCK_SKEW_SECONDS:-5}
      INTERNAL_JWT_MAX_TTL_SECONDS: ${INTERNAL_JWT_MAX_TTL_SECONDS:-300}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-24000}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-120}
      AGENT_MODEL_MAX_OUTPUT_TOKENS: ${AGENT_MODEL_MAX_OUTPUT_TOKENS:-4096}
      AGENT_MODEL_MAX_RETRIES: ${AGENT_MODEL_MAX_RETRIES:-0}
      AGENT_V2_ENABLED: ${AGENT_V2_ENABLED:-false}
      AGENT_DAG_MAX_TASKS: ${AGENT_DAG_MAX_TASKS:-6}
      AGENT_DAG_MAX_PARALLEL_WORKERS: ${AGENT_DAG_MAX_PARALLEL_WORKERS:-8}
      AGENT_DAG_REPLAN_ENABLED: ${AGENT_DAG_REPLAN_ENABLED:-true}
      AGENT_DAG_REPLAN_MAX_REPLANS: ${AGENT_DAG_REPLAN_MAX_REPLANS:-1}
      AGENT_DAG_REPLAN_THRESHOLD: ${AGENT_DAG_REPLAN_THRESHOLD:-0.75}
      AGENT_DAG_REPLAN_WEIGHT_CORRECTNESS: ${AGENT_DAG_REPLAN_WEIGHT_CORRECTNESS:-0.5}
      AGENT_DAG_REPLAN_WEIGHT_COMPLETENESS: ${AGENT_DAG_REPLAN_WEIGHT_COMPLETENESS:-0.35}
      AGENT_DAG_REPLAN_WEIGHT_CLARITY: ${AGENT_DAG_REPLAN_WEIGHT_CLARITY:-0.15}
      AGENT_PLANNER_MAX_TOKENS: ${AGENT_PLANNER_MAX_TOKENS:-1200}
      AGENT_PLANNER_TIMEOUT_SECONDS: ${AGENT_PLANNER_TIMEOUT_SECONDS:-30}
      AGENT_PLANNER_MAX_RETRIES: ${AGENT_PLANNER_MAX_RETRIES:-0}
      AGENT_CHAINING_STEPS_JSON: '${AGENT_CHAINING_STEPS_JSON:-[{"name":"translate","instruction":"把输入内容翻译成英文，只输出译文，不要额外解释","gateMinLength":10},{"name":"summarize","instruction":"用一句中文概括上一步英文内容的要点","gateMinLength":8}]}'
      AGENT_VOTING_N: ${AGENT_VOTING_N:-3}
      AGENT_VOTING_MAX_CANDIDATES: ${AGENT_VOTING_MAX_CANDIDATES:-10}
      AGENT_VOTING_STRATEGY: ${AGENT_VOTING_STRATEGY:-majority}
      AGENT_VOTING_MIN_AGREEMENT: ${AGENT_VOTING_MIN_AGREEMENT:-0.5}
      AGENT_SIBLING_MAX_PARALLEL_WORKERS: ${AGENT_SIBLING_MAX_PARALLEL_WORKERS:-10}
      AGENT_REFLEXION_THRESHOLD: ${AGENT_REFLEXION_THRESHOLD:-0.75}
      AGENT_REFLEXION_MAX_ATTEMPTS: ${AGENT_REFLEXION_MAX_ATTEMPTS:-2}
      AGENT_REFLEXION_WEIGHT_CORRECTNESS: ${AGENT_REFLEXION_WEIGHT_CORRECTNESS:-0.4}
      AGENT_REFLEXION_WEIGHT_COMPLETENESS: ${AGENT_REFLEXION_WEIGHT_COMPLETENESS:-0.4}
      AGENT_REFLEXION_WEIGHT_CLARITY: ${AGENT_REFLEXION_WEIGHT_CLARITY:-0.2}
      AGENT_SESSION_STORE: ${AGENT_SESSION_STORE:-memory}
      AGENT_SESSION_REDIS_URL: ${AGENT_SESSION_REDIS_URL:-}
      AGENT_SESSION_REDIS_NAMESPACE: ${AGENT_SESSION_REDIS_NAMESPACE:-agentscope:agent-session}
      AGENT_SESSION_TTL_SECONDS: ${AGENT_SESSION_TTL_SECONDS:-86400}
      AGENT_SESSION_LEASE_SECONDS: ${AGENT_SESSION_LEASE_SECONDS:-180}
      GATEWAY_BASE_URL: ${DOCKER_GATEWAY_BASE_URL:-http://host.docker.internal:4000/v1}
      KNOWLEDGE_BASE_URL: ${DOCKER_KNOWLEDGE_BASE_URL:-http://host.docker.internal:8084}
      ANALYTICS_BASE_URL: ${DOCKER_ANALYTICS_BASE_URL:-http://host.docker.internal:8083}
      WORKFLOW_BASE_URL: ${DOCKER_WORKFLOW_BASE_URL:-http://host.docker.internal:8082}
      AGENT_REFUND_START_ENABLED: ${AGENT_REFUND_START_ENABLED:-false}
      AGENT_CONFIRMATION_SECRET: ${AGENT_CONFIRMATION_SECRET:-}
      AGENT_CONFIRMATION_ISSUER: ${AGENT_CONFIRMATION_ISSUER:-agentscope-platform}
      AGENT_CONFIRMATION_AUDIENCE: ${AGENT_CONFIRMATION_AUDIENCE:-agentscope-tool-execution}
      AGENT_CONFIRMATION_KEY_ID: ${AGENT_CONFIRMATION_KEY_ID:-agentscope-confirmation-v1}
      AGENT_CONFIRMATION_TTL_SECONDS: ${AGENT_CONFIRMATION_TTL_SECONDS:-120}
      AGENT_CONFIRMATION_CLOCK_SKEW_SECONDS: ${AGENT_CONFIRMATION_CLOCK_SKEW_SECONDS:-5}
      AGENT_CONFIRMATION_MAX_GRANTS: ${AGENT_CONFIRMATION_MAX_GRANTS:-8}
      AGENT_CONFIRMATION_REPLAY_STORE: ${AGENT_CONFIRMATION_REPLAY_STORE:-memory}
      AGENT_CONFIRMATION_REDIS_URL: ${AGENT_CONFIRMATION_REDIS_URL:-}
      AGENT_CONFIRMATION_REDIS_NAMESPACE: ${AGENT_CONFIRMATION_REDIS_NAMESPACE:-agentscope:tool-confirmation}
      AGENT_DOWNSTREAM_JWT_HEADER: ${AGENT_DOWNSTREAM_JWT_HEADER:-X-Agent-Service-Token}
      AGENT_DOWNSTREAM_JWT_SECRET: ${AGENT_DOWNSTREAM_JWT_SECRET:-}
      AGENT_DOWNSTREAM_JWT_ISSUER: ${AGENT_DOWNSTREAM_JWT_ISSUER:-agentscope-platform}
      AGENT_DOWNSTREAM_JWT_SUBJECT: ${AGENT_DOWNSTREAM_JWT_SUBJECT:-agentscope-orchestrator}
      AGENT_DOWNSTREAM_JWT_KEY_ID: ${AGENT_DOWNSTREAM_JWT_KEY_ID:-agentscope-downstream-v1}
      AGENT_DOWNSTREAM_JWT_TTL_SECONDS: ${AGENT_DOWNSTREAM_JWT_TTL_SECONDS:-60}
      AGENT_MCP_AUDIENCE: ${AGENT_MCP_AUDIENCE:-mcp-provider}
      AGENT_BROWSER_AUDIENCE: ${AGENT_BROWSER_AUDIENCE:-browser-sandbox}
      AGENT_CODE_AUDIENCE: ${AGENT_CODE_AUDIENCE:-code-sandbox}
      AGENT_MCP_ENABLED: ${AGENT_MCP_ENABLED:-false}
      AGENT_MCP_URL: ${AGENT_MCP_URL:-}
      AGENT_MCP_TOOLS_JSON: '${AGENT_MCP_TOOLS_JSON:-[]}'
      AGENT_MCP_MAX_ARGUMENTS_BYTES: ${AGENT_MCP_MAX_ARGUMENTS_BYTES:-65536}
      AGENT_MCP_MAX_RESULT_CHARS: ${AGENT_MCP_MAX_RESULT_CHARS:-32768}
      AGENT_BROWSER_ENABLED: ${AGENT_BROWSER_ENABLED:-false}
      AGENT_BROWSER_SANDBOX_URL: ${AGENT_BROWSER_SANDBOX_URL:-}
      AGENT_BROWSER_ALLOWED_HOSTS_JSON: '${AGENT_BROWSER_ALLOWED_HOSTS_JSON:-[]}'
      AGENT_BROWSER_TIMEOUT_SECONDS: ${AGENT_BROWSER_TIMEOUT_SECONDS:-15}
      AGENT_BROWSER_MAX_INPUT_CHARS: ${AGENT_BROWSER_MAX_INPUT_CHARS:-4000}
      AGENT_BROWSER_MAX_OUTPUT_CHARS: ${AGENT_BROWSER_MAX_OUTPUT_CHARS:-20000}
      AGENT_CODE_EXEC_ENABLED: ${AGENT_CODE_EXEC_ENABLED:-false}
      AGENT_CODE_SANDBOX_URL: ${AGENT_CODE_SANDBOX_URL:-}
      AGENT_CODE_TIMEOUT_SECONDS: ${AGENT_CODE_TIMEOUT_SECONDS:-3}
      AGENT_CODE_MAX_SOURCE_CHARS: ${AGENT_CODE_MAX_SOURCE_CHARS:-4000}
      AGENT_CODE_MAX_OUTPUT_CHARS: ${AGENT_CODE_MAX_OUTPUT_CHARS:-2000}
      AGENT_CODE_MAX_MEMORY_MB: ${AGENT_CODE_MAX_MEMORY_MB:-64}
      AGENT_CODE_MAX_PROCESSES: ${AGENT_CODE_MAX_PROCESSES:-4}
      ORDER_BASE_URL: ${DOCKER_ORDER_BASE_URL:-http://host.docker.internal:8093}
      ASYNC_TASK_ENABLED: ${ASYNC_TASK_ENABLED:-false}
      ASYNC_TASK_BASE_URL: ${DOCKER_ASYNC_TASK_BASE_URL:-http://host.docker.internal:8086}
      ASYNC_TASK_WORKER_ID: ${ASYNC_TASK_WORKER_ID:-}
      ASYNC_TASK_WORKER_JWT_HEADER: ${ASYNC_TASK_WORKER_JWT_HEADER:-X-Async-Worker-Token}
      ASYNC_TASK_WORKER_JWT_SECRET: ${ASYNC_TASK_WORKER_JWT_SECRET:-}
      ASYNC_TASK_WORKER_JWT_ISSUER: ${ASYNC_TASK_WORKER_JWT_ISSUER:-platform-services}
      ASYNC_TASK_WORKER_JWT_AUDIENCE: ${ASYNC_TASK_WORKER_JWT_AUDIENCE:-async-task-worker}
      ASYNC_TASK_WORKER_JWT_KEY_ID: ${ASYNC_TASK_WORKER_JWT_KEY_ID:-async-task-worker-v1}
      ASYNC_TASK_WORKER_JWT_TTL_SECONDS: ${ASYNC_TASK_WORKER_JWT_TTL_SECONDS:-60}
      ASYNC_TASK_LEASE_SECONDS: ${ASYNC_TASK_LEASE_SECONDS:-60}
      ASYNC_TASK_HEARTBEAT_SECONDS: ${ASYNC_TASK_HEARTBEAT_SECONDS:-15}
      ASYNC_TASK_MAX_CONCURRENT: ${ASYNC_TASK_MAX_CONCURRENT:-8}
      ASYNC_TASK_MAX_INFLIGHT: ${ASYNC_TASK_MAX_INFLIGHT:-100}
      ASYNC_TASK_MAX_RUNTIME_SECONDS: ${ASYNC_TASK_MAX_RUNTIME_SECONDS:-240}
      ASYNC_TASK_DRAIN_TIMEOUT_SECONDS: ${ASYNC_TASK_DRAIN_TIMEOUT_SECONDS:-30}
      ASYNC_TASK_TOKEN_SAFETY_SECONDS: ${ASYNC_TASK_TOKEN_SAFETY_SECONDS:-20}
      ASYNC_TASK_CONNECT_TIMEOUT_SECONDS: ${ASYNC_TASK_CONNECT_TIMEOUT_SECONDS:-1}
      ASYNC_TASK_REQUEST_TIMEOUT_SECONDS: ${ASYNC_TASK_REQUEST_TIMEOUT_SECONDS:-5}
      ASYNC_TASK_STREAM_IDLE_TIMEOUT_SECONDS: ${ASYNC_TASK_STREAM_IDLE_TIMEOUT_SECONDS:-30}
      ASYNC_TASK_EVENT_MAX_BYTES: ${ASYNC_TASK_EVENT_MAX_BYTES:-262144}
      ASYNC_TASK_PROGRESS_ENABLED: ${ASYNC_TASK_PROGRESS_ENABLED:-true}
      HTTP_MAX_CONNECTIONS: ${HTTP_MAX_CONNECTIONS:-100}
      HTTP_MAX_KEEPALIVE_CONNECTIONS: ${HTTP_MAX_KEEPALIVE_CONNECTIONS:-20}
      HTTP_KEEPALIVE_EXPIRY_SECONDS: ${HTTP_KEEPALIVE_EXPIRY_SECONDS:-30}
      HTTP_DEPENDENCY_MAX_CONCURRENT: ${HTTP_DEPENDENCY_MAX_CONCURRENT:-32}
      HTTP_CIRCUIT_FAILURE_THRESHOLD: ${HTTP_CIRCUIT_FAILURE_THRESHOLD:-5}
      HTTP_CIRCUIT_RECOVERY_SECONDS: ${HTTP_CIRCUIT_RECOVERY_SECONDS:-15}
      READINESS_PROBE_TIMEOUT_SECONDS: ${READINESS_PROBE_TIMEOUT_SECONDS:-2}
      AGENT_INPUT_COST_USD_PER_MILLION_TOKENS: ${AGENT_INPUT_COST_USD_PER_MILLION_TOKENS:-0}
      AGENT_OUTPUT_COST_USD_PER_MILLION_TOKENS: ${AGENT_OUTPUT_COST_USD_PER_MILLION_TOKENS:-0}
    ports:
      - "${APP_PORT:-8085}:8085"
    stop_grace_period: ${AGENTSCOPE_STOP_GRACE_PERIOD:-45s}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
