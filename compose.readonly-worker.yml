# 可选只读API/worker分离. Java先迁移V3并开启ASYNC_TASK_DISPATCH_ENABLED.
# 使用 docker compose -f compose.yml -f compose.readonly-worker.yml up -d.
services:
  orchestrator:
    environment:
      ASYNC_TASK_ROLE: api
      ASYNC_TASK_ENABLED: "true"
      ASYNC_TASK_WORKER_ID: ${ASYNC_TASK_WORKER_ID:-agentscope-platform}
      AGENT_REFUND_START_ENABLED: "false"
      AGENT_MCP_ENABLED: "false"
      AGENT_BROWSER_ENABLED: "false"
      AGENT_CODE_EXEC_ENABLED: "false"
  worker:
    extends:
      file: compose.yml
      service: orchestrator
    command: ["python", "-m", "agentscope_platform.worker"]
    ports: !override []
    healthcheck:
      test: ["CMD", "python", "-m", "agentscope_platform.worker", "--health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      ASYNC_TASK_ROLE: worker
      ASYNC_TASK_ENABLED: "true"
      ASYNC_TASK_WORKER_ID: ${ASYNC_TASK_WORKER_ID:-agentscope-platform}
      AGENT_REFUND_START_ENABLED: "false"
      AGENT_MCP_ENABLED: "false"
      AGENT_BROWSER_ENABLED: "false"
      AGENT_CODE_EXEC_ENABLED: "false"
