name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Verify contract snapshots
        run: uv run python scripts/export_contracts.py --check

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: >
          uv run pytest
          --cov=agentscope_platform
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Build package
        run: uv build

      - name: Validate Compose
        run: docker compose -f compose.yml config
